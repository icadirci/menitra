; Production PHP settings (FPM and CLI). See phpdocker/php-fpm/Dockerfile.prod.

expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED

memory_limit = 256M
max_execution_time = 60

; Largest tenant image is 5 MB (App\Enums\MediaType::maxKilobytes()); keep in
; sync with client_max_body_size in phpdocker/nginx/nginx.prod.conf.template.
upload_max_filesize = 6M
post_max_size = 8M
max_file_uploads = 20

session.use_strict_mode = 1

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; Code changes need a php-fpm restart (scripts/deploy.sh).
opcache.validate_timestamps = 0
opcache.save_comments = 1
