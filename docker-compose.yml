services:
    redis:
        image: 'redis:alpine'

    postgres:
        image: 'postgres:15-alpine'
        working_dir: /application
        volumes:
            - '.:/application'
            - 'postgres-data:/var/lib/postgresql/data'
        environment:
            - POSTGRES_USER=root
            - POSTGRES_PASSWORD=rootpassword
            - POSTGRES_DB=restano
        ports:
            - '37004:5432'

    webserver:
        image: 'nginx:alpine'
        working_dir: /application
        volumes:
            - '.:/application'
            - './phpdocker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf'
        ports:
            - '37000:80'

    php-fpm:
        build: phpdocker/php-fpm
        working_dir: /application
        volumes:
            - '.:/application'
            - './phpdocker/php-fpm/php-ini-overrides.ini:/etc/php/8.5/fpm/conf.d/99-overrides.ini'
            - './phpdocker/php-fpm/php-ini-overrides.ini:/etc/php/8.5/cli/conf.d/99-overrides.ini'

    # On-demand Node.js (LTS) for npm and Vite. Not started by `docker compose up`;
    # see CLAUDE.md §9 for npm ci / run dev / run build commands.
    node:
        image: 'node:24-bookworm-slim'
        # Proper PID 1 (signal forwarding, zombie reaping). Stop `npm run dev` with
        # Ctrl+C so Vite removes public/hot; delete that file if the container is killed.
        init: true
        working_dir: /application
        volumes:
            - '.:/application'
        ports:
            - '5173:5173'
        profiles:
            - tools

volumes:
    postgres-data:
